[workspace]
resolver = "2"
members = ["crates/streaid-core", "crates/streaid-ffi"]

[workspace.package]
version = "0.7.0"
edition = "2021"
authors = ["SUSH"]
license = "MIT"

[workspace.dependencies]
streaid-core = { path = "crates/streaid-core" }

anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
futures-util = "0.3"
keyring = "4"
once_cell = "1.18"
open = "5"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rodio = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
twitch_oauth2 = { version = "0.17", features = ["reqwest", "client"] }

base64 = "0.23"
