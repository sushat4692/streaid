<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaid Alert</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #info, #clip {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
  }
  .info-card {
    display: flex; gap: 24px; align-items: center;
    padding: 28px 36px; border-radius: 24px;
    background: rgba(15, 15, 20, 0.92);
    border: 1px solid rgba(145, 70, 255, 0.5);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    transform: scale(0.92); opacity: 0;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #info.active .info-card { transform: scale(1); opacity: 1; }
  .info-card img {
    width: 160px; height: 160px; border-radius: 50%;
    object-fit: cover; border: 3px solid #9146ff; background: #222;
  }
  .info-copy .kicker {
    font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #c4b5fd; font-weight: 700; margin-bottom: 6px;
  }
  .info-copy h1 {
    margin: 0 0 6px; font-size: 44px; color: #fff; line-height: 1.05;
  }
  .info-copy p { margin: 0; color: #adb0bd; font-size: 18px; }

  #clip { background: rgba(0, 0, 0, 0.75); }
  .clip-card {
    width: min(96vw, 1400px); aspect-ratio: 16 / 9;
    background: #000; border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.7);
    transform: scale(0.94); opacity: 0; transition: all 0.3s ease;
  }
  #clip.active .clip-card { transform: scale(1); opacity: 1; }
  .clip-card iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div id="info">
  <div class="info-card">
    <img id="info-image" alt="">
    <div class="info-copy">
      <div class="kicker">Please check the Streamer!</div>
      <h1 id="info-name"></h1>
      <p id="info-category"></p>
    </div>
  </div>
</div>

<div id="clip">
  <div class="clip-card">
    <iframe id="clip-frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'ja' ? 'ja' : 'en';
  const labels = {
    en: { kicker: 'Please check the Streamer!' },
    ja: { kicker: '配信者をチェック！' }
  };
  document.querySelector('.kicker').textContent = labels[lang].kicker;

  const info = document.getElementById('info');
  const infoImage = document.getElementById('info-image');
  const infoName = document.getElementById('info-name');
  const infoCategory = document.getElementById('info-category');
  const clip = document.getElementById('clip');
  const clipFrame = document.getElementById('clip-frame');
  let infoTimer = null;

  function embedSrc(url) {
    if (!url) return '';
    const separator = url.includes('?') ? '&' : '?';
    return url + separator + 'parent=localhost&autoplay=true';
  }

  function hideInfo() {
    info.classList.remove('active');
    setTimeout(() => { info.style.display = 'none'; }, 350);
  }

  function hideClip() {
    clip.classList.remove('active');
    setTimeout(() => {
      clip.style.display = 'none';
      clipFrame.src = '';
    }, 300);
  }

  const es = new EventSource('/alert/events');

  es.addEventListener('info', event => {
    const data = JSON.parse(event.data);
    infoImage.src = data.profile_image_url || '';
    infoImage.style.display = data.profile_image_url ? 'block' : 'none';
    infoName.textContent = data.display_name || data.login || '';
    infoCategory.textContent = data.category || '';
    info.style.display = 'flex';
    requestAnimationFrame(() => info.classList.add('active'));
    clearTimeout(infoTimer);
    infoTimer = setTimeout(hideInfo, Math.max(1, Number(data.duration) || 8) * 1000);
  });

  es.addEventListener('clip', event => {
    const data = JSON.parse(event.data);
    clipFrame.src = embedSrc(data.embed_url);
    clip.style.display = 'flex';
    requestAnimationFrame(() => clip.classList.add('active'));
  });

  es.addEventListener('clip:stop', hideClip);
  window.addEventListener('beforeunload', () => es.close());
</script>
</body>
</html>
