<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaid Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  #overlay {
    position: fixed;
    bottom: 32px;
    left: 32px;
    width: 960px;
    display: flex;
    flex-direction: column-reverse;
    gap: 16px;
  }

  .entry {
    background: rgba(0, 0, 0, 0.72);
    border-left: 6px solid #8d78fd;
    border-radius: 8px;
    padding: 20px 24px;
    color: #fff;
    font-size: 28px;
    line-height: 1.45;
    animation: fadeIn 0.3s ease;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }

  .entry.fading {
    animation: fadeOut 0.5s ease forwards;
  }

  .entry-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .badge {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 12px;
    border-radius: 6px;
    text-transform: uppercase;
  }

  .badge-ts { background: #8d78fd; color: #fff; }
  .badge-dict { background: #6534ed; color: #fff; }

  .username {
    font-weight: 600;
    color: #c4b8ff;
    font-size: 26px;
  }

  .original {
    color: #ccc;
    font-size: 24px;
    margin-bottom: 12px;
    font-style: italic;
  }

  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .suggestion {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .formality {
    font-size: 20px;
    color: #9180ff;
    width: 92px;
    flex-shrink: 0;
    text-transform: capitalize;
  }

  .suggestion-text {
    color: #fff;
    font-size: 28px;
  }

  .dict-word {
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }

  .dict-meaning {
    color: #ddd;
    font-size: 26px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-24px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes fadeOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-24px); }
  }
</style>
</head>
<body>
<div id="overlay"></div>

<script>
  const overlay = document.getElementById('overlay');
  const MAX_ENTRIES = 5;
  const DISPLAY_MS = 12000;
  const FADE_MS = 500;

  function addEntry(html) {
    // Remove oldest if at capacity
    while (overlay.children.length >= MAX_ENTRIES) {
      overlay.removeChild(overlay.lastChild);
    }

    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = html;
    overlay.prepend(el);

    // Schedule fade-out then removal
    setTimeout(() => {
      el.classList.add('fading');
      setTimeout(() => el.remove(), FADE_MS);
    }, DISPLAY_MS);
  }

  function buildTranslationHTML(data) {
    const suggestions = (data.suggestions || []).map(s => `
      <div class="suggestion">
        <span class="formality">${escHtml(s.formality)}</span>
        <span class="suggestion-text">${escHtml(s.text)}</span>
      </div>`).join('');

    return `
      <div class="entry-header">
        <span class="badge badge-ts">!ts</span>
        <span class="username">@${escHtml(data.original_user)}</span>
      </div>
      <div class="original">${escHtml(data.original_message)}</div>
      <div class="suggestions">${suggestions}</div>`;
  }

  function buildDictionaryHTML(data) {
    return `
      <div class="entry-header">
        <span class="badge badge-dict">!d</span>
        <span class="username">@${escHtml(data.original_user)}</span>
      </div>
      <div class="dict-word">${escHtml(data.word)}</div>
      <div class="dict-meaning">${escHtml(data.meaning)}</div>`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function connect() {
    const es = new EventSource('/events');

    es.addEventListener('translation', e => {
      try {
        const data = JSON.parse(e.data);
        addEntry(buildTranslationHTML(data));
      } catch {}
    });

    es.addEventListener('dictionary', e => {
      try {
        const data = JSON.parse(e.data);
        addEntry(buildDictionaryHTML(data));
      } catch {}
    });

    es.onerror = () => {
      es.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
